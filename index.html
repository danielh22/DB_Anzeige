<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S-Bahn Anzeige</title>
<meta name="theme-color" content="#0b1f33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #0a7d3e; --sbahn: #008d4f; --late: #c2410c;
    --ok: #15803d; --bad: #b91c1c; --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --card: #141d2e; --text: #e5e7eb; --muted: #94a3b8;
      --line: #243047; --accent: #34d399; --sbahn: #0f9f5e; --late: #fb923c;
      --ok: #4ade80; --bad: #f87171; --input: #0f1726;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(12px, env(safe-area-inset-top)) 16px 24px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
  .sbadge { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    background: var(--sbahn); color: #fff; font-weight: 800; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .route-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .route-title { font-weight: 700; font-size: 1.05rem; word-break: break-word; }
  .route-title .arrow { color: var(--muted); padding: 0 4px; }
  .meta { color: var(--muted); font-size: .8rem; }
  .conn { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line); }
  .conn:first-of-type { border-top: 0; }
  .line { background: var(--sbahn); color: #fff; font-weight: 700; border-radius: 999px; padding: 2px 10px;
    font-size: .85rem; white-space: nowrap; text-align: center; }
  .line.other { background: #64748b; }
  .times { font-variant-numeric: tabular-nums; }
  .dep { font-size: 1.5rem; font-weight: 750; }
  .planned { text-decoration: line-through; color: var(--muted); font-size: .95rem; margin-left: 6px; }
  .delay { color: var(--late); font-weight: 700; margin-left: 6px; }
  .ontime { color: var(--ok); font-weight: 600; margin-left: 6px; font-size: .85rem; }
  .countdown { font-size: 1.25rem; font-weight: 750; text-align: right; font-variant-numeric: tabular-nums; }
  .countdown small { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); }
  .sub { grid-column: 2 / 4; color: var(--muted); font-size: .85rem; }
  .cancelled .dep { text-decoration: line-through; color: var(--bad); }
  .cancel-tag { color: var(--bad); font-weight: 700; }
  .remark { grid-column: 1 / 4; font-size: .8rem; color: var(--late); }
  .msg { color: var(--muted); padding: 10px 0; }
  .err { color: var(--bad); }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font: inherit; font-size: .9rem; cursor: pointer; text-decoration: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.icon { padding: 6px 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .route-actions { flex-wrap: nowrap; flex-shrink: 0; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=url], input[type=number], select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--input); color: var(--text); font: inherit; }
  .suggest { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .suggest:empty { display: none; }
  .suggest li { padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; background: var(--input); }
  .suggest li:first-child { border-top: 0; }
  .suggest li:hover, .suggest li:focus { background: var(--line); }
  .chosen { margin-top: 6px; font-size: .85rem; color: var(--ok); }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--text); font-size: .9rem; }
  details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .hidden { display: none !important; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  code { font-size: .8rem; word-break: break-all; }
  /* Widget mode: nur die Anzeige, kompakt */
  body.widget { padding: 8px; }
  body.widget h1, body.widget #setup, body.widget #routesBar, body.widget .route-actions { display: none !important; }
  body.widget .card { margin-bottom: 0; border-radius: 12px; padding: 10px 12px; }
  body.widget .dep { font-size: 1.3rem; }
  body.widget .conn { padding: 8px 0; }
</style>
</head>
<body>
  <h1><span class="sbadge">S</span> S-Bahn Anzeige</h1>

  <div id="routesBar" class="row" style="margin-bottom:12px"></div>

  <main id="board"></main>

  <section id="setup" class="card hidden">
    <div class="route-head"><div class="route-title" id="setupTitle">Neue Verbindung</div></div>

    <label for="fromInput">Start</label>
    <input id="fromInput" type="text" placeholder="z. B. Stuttgart Hbf" autocomplete="off">
    <ul id="fromSuggest" class="suggest"></ul>
    <div id="fromChosen" class="chosen"></div>

    <label for="toInput">Ziel</label>
    <input id="toInput" type="text" placeholder="z. B. Flughafen/Messe" autocomplete="off">
    <ul id="toSuggest" class="suggest"></ul>
    <div id="toChosen" class="chosen"></div>

    <label class="check"><input id="onlySbahn" type="checkbox" checked> Nur S-Bahn (keine anderen Verkehrsmittel)</label>
    <label class="check"><input id="directOnly" type="checkbox" checked> Nur Direktverbindungen (ohne Umstieg)</label>

    <label for="countInput">Anzahl angezeigter Verbindungen</label>
    <input id="countInput" type="number" min="1" max="6" value="2">

    <label for="offsetInput">Vorlaufzeit (Minuten, z. B. Fußweg zum Bahnhof)</label>
    <input id="offsetInput" type="number" min="0" max="120" value="0">

    <div class="row" style="margin-top:14px">
      <button class="primary" id="saveBtn">Speichern</button>
      <button id="cancelBtn">Abbrechen</button>
    </div>

    <details style="margin-top:16px">
      <summary>Erweitert: API-Server</summary>
      <label for="apiInput">Basis-URL der DB-REST-API</label>
      <input id="apiInput" type="url" placeholder="https://v6.db.transport.rest">
      <p class="meta">Standard ist die öffentliche, kostenlose API <code>v6.db.transport.rest</code> (Daten der Deutschen Bahn, kein API-Key nötig).
        Falls sie ausfällt, kann hier eine eigene Instanz von <code>db-rest</code> eingetragen werden.</p>
    </details>
  </section>

<script>
'use strict';
const DEFAULT_API = 'https://v6.db.transport.rest';
const STORE_KEY = 'sbahn-anzeige-v1';
const REFRESH_MS = 60_000;
const $ = (id) => document.getElementById(id);

// ---------- State / Speicher ----------
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
}
const state = Object.assign({ routes: [], active: 0, api: '' }, loadState());
const api = () => (state.api || DEFAULT_API).replace(/\/+$/, '');

// Verbindung kann auch komplett über die URL definiert werden (für Widgets/Lesezeichen):
// ?from=8000096&fromName=Stuttgart%20Hbf&to=8005768&toName=Flughafen&n=2&widget=1
const params = new URLSearchParams(location.search);
let urlRoute = null;
if (params.get('from') && params.get('to')) {
  urlRoute = {
    from: { id: params.get('from'), name: params.get('fromName') || params.get('from') },
    to: { id: params.get('to'), name: params.get('toName') || params.get('to') },
    count: clampInt(params.get('n'), 1, 6, 2),
    offset: clampInt(params.get('offset'), 0, 120, 0),
    onlySbahn: params.get('sbahn') !== '0',
    directOnly: params.get('direct') !== '0',
  };
}
if (params.get('api')) state.api = params.get('api');
if (params.has('widget')) document.body.classList.add('widget');

function clampInt(v, min, max, def) {
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
}

// ---------- API ----------
async function apiGet(path, query) {
  const url = new URL(api() + path);
  Object.entries(query).forEach(([k, v]) => { if (v !== undefined && v !== null) url.searchParams.set(k, String(v)); });
  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
      clearTimeout(t);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 800));
    }
  }
  throw lastErr;
}

function searchStations(q) {
  return apiGet('/locations', { query: q, results: 8, stops: true, addresses: false, poi: false });
}

const ALL_PRODUCTS = ['nationalExpress','national','regionalExpress','regional','suburban','bus','ferry','subway','tram','taxi'];

async function fetchJourneys(route) {
  const when = new Date(Date.now() + (route.offset || 0) * 60000);
  const q = {
    from: route.from.id, to: route.to.id, departure: when.toISOString(),
    results: Math.max(route.count + 3, 5), stopovers: false, remarks: true, language: 'de',
  };
  if (route.directOnly) q.transfers = 0;
  if (route.onlySbahn) ALL_PRODUCTS.forEach(p => q[p] = (p === 'suburban'));

  let journeys = [];
  let res = await apiGet('/journeys', q);
  journeys = filterJourneys(res.journeys || [], route, when);
  // Falls zu wenige Treffer: spätere Verbindungen nachladen
  for (let i = 0; i < 2 && journeys.length < route.count && res.laterRef; i++) {
    res = await apiGet('/journeys', Object.assign({}, q, { departure: undefined, laterThan: res.laterRef }));
    journeys = journeys.concat(filterJourneys(res.journeys || [], route, when));
  }
  // Duplikate entfernen & sortieren
  const seen = new Set();
  journeys = journeys.filter(j => { const k = depOf(j).planned + lineName(j); if (seen.has(k)) return false; seen.add(k); return true; });
  journeys.sort((a, b) => new Date(depOf(a).planned) - new Date(depOf(b).planned));
  return journeys.slice(0, route.count);
}

function realLegs(j) { return (j.legs || []).filter(l => !l.walking); }
function depOf(j) {
  const l = realLegs(j)[0] || j.legs[0];
  return { planned: l.plannedDeparture, actual: l.departure, delay: l.departureDelay,
           platform: l.departurePlatform, plannedPlatform: l.plannedDeparturePlatform };
}
function arrOf(j) {
  const ls = realLegs(j); const l = ls[ls.length - 1] || j.legs[j.legs.length - 1];
  return { planned: l.plannedArrival, actual: l.arrival, delay: l.arrivalDelay };
}
function lineName(j) { return realLegs(j).map(l => l.line?.name || '?').join(' › '); }

function filterJourneys(list, route, when) {
  return list.filter(j => {
    const legs = realLegs(j);
    if (!legs.length) return false;
    if (route.directOnly && legs.length > 1) return false;
    if (route.onlySbahn && legs.some(l => l.line && l.line.product !== 'suburban')) return false;
    const d = depOf(j);
    const t = new Date(d.actual || d.planned);
    return t.getTime() >= when.getTime() - 60000; // bereits abgefahrene ausblenden
  });
}

// ---------- Darstellung ----------
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '–';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let current = { journeys: null, error: null, loadedAt: null, loading: false };
let refreshTimer = null;

function activeRoute() { return urlRoute || state.routes[state.active] || null; }

function renderRoutesBar() {
  const bar = $('routesBar');
  if (urlRoute) { bar.innerHTML = ''; return; }
  bar.innerHTML = state.routes.map((r, i) =>
    `<button class="${i === state.active ? 'primary' : ''}" data-i="${i}">${esc(short(r.from.name))} → ${esc(short(r.to.name))}</button>`
  ).join('') + `<button data-new="1">+ Verbindung</button>`;
  bar.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
    state.active = +b.dataset.i; saveState(); renderRoutesBar(); load();
  });
  bar.querySelector('button[data-new]').onclick = () => openSetup(null);
}
const short = (n) => n.length > 22 ? n.slice(0, 21) + '…' : n;

function renderBoard() {
  const r = activeRoute();
  const board = $('board');
  if (!r) {
    board.innerHTML = `<div class="card"><div class="msg">Noch keine Verbindung gespeichert. Tippe auf <b>+ Verbindung</b>, um Start und Ziel auszuwählen.</div></div>`;
    return;
  }
  let body;
  if (current.error && !current.journeys) {
    body = `<div class="msg err">Fehler beim Laden: ${esc(current.error)}<br><span class="meta">API: ${esc(api())}</span></div>`;
  } else if (!current.journeys) {
    body = `<div class="msg">Lade Verbindungen…</div>`;
  } else if (!current.journeys.length) {
    body = `<div class="msg">Keine passenden Verbindungen gefunden.</div>`;
  } else {
    body = current.journeys.map(renderJourney).join('');
  }
  const status = current.loadedAt
    ? `Stand ${fmtTime(current.loadedAt.toISOString())}${current.error ? ' · <span class="err">Aktualisierung fehlgeschlagen</span>' : ''}${current.loading ? ' · lädt…' : ''}`
    : '';
  board.innerHTML = `
    <div class="card">
      <div class="route-head">
        <div class="route-title">${esc(r.from.name)}<span class="arrow">→</span>${esc(r.to.name)}</div>
        <div class="row route-actions">
          <button class="icon" id="swapBtn" title="Richtung tauschen" aria-label="Richtung tauschen">⇅</button>
          ${urlRoute ? '' : '<button class="icon" id="editBtn" title="Bearbeiten" aria-label="Bearbeiten">✎</button>'}
        </div>
      </div>
      ${body}
      <div class="footer">
        <span class="meta">${status}</span>
        <div class="row route-actions">
          <button class="icon" id="reloadBtn" aria-label="Aktualisieren">↻</button>
          ${urlRoute ? '' : '<button class="icon" id="linkBtn" title="Widget-Link kopieren">🔗</button>'}
        </div>
      </div>
    </div>`;
  $('reloadBtn').onclick = () => load();
  $('swapBtn').onclick = () => {
    const rr = activeRoute(); [rr.from, rr.to] = [rr.to, rr.from];
    if (!urlRoute) saveState(); renderRoutesBar(); load();
  };
  if ($('editBtn')) $('editBtn').onclick = () => openSetup(state.active);
  if ($('linkBtn')) $('linkBtn').onclick = () => copyWidgetLink(r);
}

function renderJourney(j) {
  const d = depOf(j), a = arrOf(j);
  const legs = realLegs(j);
  const cancelled = j.legs.some(l => l.cancelled);
  const depTime = new Date(d.actual || d.planned);
  const mins = Math.round((depTime - Date.now()) / 60000);
  const delayMin = d.delay != null ? Math.round(d.delay / 60) : null;
  const delayHtml = cancelled ? '<span class="cancel-tag">Fällt aus</span>'
    : delayMin == null ? ''
    : delayMin > 0 ? `<span class="planned">${fmtTime(d.planned)}</span><span class="delay">+${delayMin}</span>`
    : '<span class="ontime">pünktlich</span>';
  const platform = d.platform || d.plannedPlatform;
  const platformChanged = d.platform && d.plannedPlatform && d.platform !== d.plannedPlatform;
  const dur = Math.round((new Date(a.actual || a.planned) - depTime) / 60000);
  const lines = legs.map(l => {
    const isS = l.line?.product === 'suburban';
    return `<span class="line ${isS ? '' : 'other'}">${esc(l.line?.name || '?')}</span>`;
  }).join(' ');
  const direction = legs[0]?.direction ? ` Richtung ${esc(legs[0].direction)}` : '';
  const remarks = legs.flatMap(l => l.remarks || [])
    .filter(rm => rm.type === 'warning' || rm.type === 'status')
    .map(rm => rm.summary || rm.text).filter(Boolean);
  const uniqRemarks = [...new Set(remarks)].slice(0, 2);
  return `
    <div class="conn ${cancelled ? 'cancelled' : ''}">
      <div>${lines}</div>
      <div class="times"><span class="dep">${fmtTime(d.actual || d.planned)}</span>${delayHtml}</div>
      <div class="countdown">${cancelled ? '' : mins <= 0 ? 'jetzt' : mins + '<small>min</small>'}</div>
      <div class="sub">
        ${platform ? `Gleis <b style="${platformChanged ? 'color:var(--late)' : ''}">${esc(platform)}</b> · ` : ''}an ${fmtTime(a.actual || a.planned)}${a.delay > 0 ? ` <span class="delay">+${Math.round(a.delay / 60)}</span>` : ''} · ${dur} min${legs.length > 1 ? ` · ${legs.length - 1}× Umstieg` : ''}<br>${direction}
      </div>
      ${uniqRemarks.map(t => `<div class="remark">⚠ ${esc(t)}</div>`).join('')}
    </div>`;
}

async function load() {
  const r = activeRoute();
  clearTimeout(refreshTimer);
  if (!r) { renderBoard(); return; }
  const key = r.from.id + '>' + r.to.id;
  if (current.key !== key) current = { key, journeys: null, error: null, loadedAt: null };
  current.loading = true; renderBoard();
  try {
    const journeys = await fetchJourneys(r);
    if (current.key !== key) return;
    current.journeys = journeys; current.error = null;
  } catch (e) {
    if (current.key !== key) return;
    current.error = e.name === 'AbortError' ? 'Zeitüberschreitung' : e.message;
  }
  current.loading = false; current.loadedAt = new Date();
  renderBoard();
  refreshTimer = setTimeout(load, REFRESH_MS);
}

// Countdown jede 20s neu zeichnen (ohne API-Aufruf)
setInterval(() => { if (current.journeys && !current.loading && $('setup').classList.contains('hidden')) renderBoard(); }, 20000);
// Beim Zurückkehren in die App sofort aktualisieren
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (!current.loadedAt || Date.now() - current.loadedAt > 30000)) load();
});

function copyWidgetLink(r) {
  const u = new URL(location.href.split('?')[0]);
  u.searchParams.set('from', r.from.id); u.searchParams.set('fromName', r.from.name);
  u.searchParams.set('to', r.to.id); u.searchParams.set('toName', r.to.name);
  u.searchParams.set('n', r.count);
  if (r.offset) u.searchParams.set('offset', r.offset);
  if (!r.onlySbahn) u.searchParams.set('sbahn', '0');
  if (!r.directOnly) u.searchParams.set('direct', '0');
  if (state.api) u.searchParams.set('api', state.api);
  u.searchParams.set('widget', '1');
  const link = u.toString();
  (navigator.clipboard?.writeText(link) || Promise.reject())
    .then(() => alert('Widget-Link kopiert:\n\n' + link))
    .catch(() => prompt('Widget-Link:', link));
}

// ---------- Einrichtung ----------
let editIndex = null, pick = { from: null, to: null };

function openSetup(index) {
  editIndex = index;
  const r = index != null ? state.routes[index] : null;
  pick = { from: r?.from || null, to: r?.to || null };
  $('setupTitle').textContent = r ? 'Verbindung bearbeiten' : 'Neue Verbindung';
  $('fromInput').value = r?.from.name || ''; $('toInput').value = r?.to.name || '';
  $('fromChosen').textContent = r ? '✓ ' + r.from.name : '';
  $('toChosen').textContent = r ? '✓ ' + r.to.name : '';
  $('onlySbahn').checked = r ? r.onlySbahn : true;
  $('directOnly').checked = r ? r.directOnly : true;
  $('countInput').value = r?.count || 2;
  $('offsetInput').value = r?.offset || 0;
  $('apiInput').value = state.api || '';
  $('cancelBtn').textContent = r ? 'Löschen' : 'Abbrechen';
  $('cancelBtn').dataset.mode = r ? 'delete' : 'cancel';
  $('setup').classList.remove('hidden');
  $('board').classList.add('hidden');
  $('fromInput').focus();
}
function closeSetup() {
  $('setup').classList.add('hidden'); $('board').classList.remove('hidden');
  $('fromSuggest').innerHTML = ''; $('toSuggest').innerHTML = '';
}

function wireAutocomplete(which) {
  const input = $(which + 'Input'), list = $(which + 'Suggest'), chosen = $(which + 'Chosen');
  let timer, seq = 0;
  input.addEventListener('input', () => {
    pick[which] = null; chosen.textContent = '';
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { list.innerHTML = ''; return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        const res = await searchStations(q);
        if (my !== seq) return;
        const stops = res.filter(s => s.type === 'stop' || s.type === 'station');
        list.innerHTML = stops.length
          ? stops.map((s, i) => `<li tabindex="0" data-i="${i}">${esc(s.name)}${s.products?.suburban ? ' <span class="line" style="font-size:.7rem;padding:0 6px">S</span>' : ''}</li>`).join('')
          : '<li>Keine Treffer</li>';
        list.querySelectorAll('li[data-i]').forEach(li => {
          const choose = () => {
            const s = stops[+li.dataset.i];
            pick[which] = { id: s.id, name: s.name };
            input.value = s.name; chosen.textContent = '✓ ' + s.name; list.innerHTML = '';
          };
          li.onclick = choose;
          li.onkeydown = (e) => { if (e.key === 'Enter') choose(); };
        });
      } catch (e) {
        if (my === seq) list.innerHTML = `<li class="err">Suche fehlgeschlagen: ${esc(e.message)}</li>`;
      }
    }, 300);
  });
}
wireAutocomplete('from'); wireAutocomplete('to');

$('saveBtn').onclick = () => {
  const apiVal = $('apiInput').value.trim();
  state.api = apiVal && apiVal !== DEFAULT_API ? apiVal : '';
  if (!pick.from || !pick.to) { alert('Bitte Start und Ziel jeweils aus der Vorschlagsliste auswählen.'); return; }
  const route = {
    from: pick.from, to: pick.to,
    count: clampInt($('countInput').value, 1, 6, 2),
    offset: clampInt($('offsetInput').value, 0, 120, 0),
    onlySbahn: $('onlySbahn').checked, directOnly: $('directOnly').checked,
  };
  if (editIndex != null) state.routes[editIndex] = route;
  else { state.routes.push(route); state.active = state.routes.length - 1; }
  saveState(); closeSetup(); renderRoutesBar(); load();
};
$('cancelBtn').onclick = () => {
  if ($('cancelBtn').dataset.mode === 'delete' && confirm('Diese Verbindung löschen?')) {
    state.routes.splice(editIndex, 1);
    state.active = Math.max(0, Math.min(state.active, state.routes.length - 1));
    saveState(); current = {}; renderRoutesBar();
  }
  closeSetup(); load();
};

// ---------- Start ----------
renderRoutesBar();
if (!activeRoute()) openSetup(null); else load();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
